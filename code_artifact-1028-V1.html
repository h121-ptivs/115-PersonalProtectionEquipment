<!DOCTYPE html>
<html lang="zh-TW" class="h-full bg-slate-100">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>適航大進擊：飛機維修個人防護裝備(PPE)與維修工單互動訓練系統</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        navy: {
                            800: '#1e3a8a',
                            900: '#0f172a',
                        },
                        sky: {
                            600: '#0284c7',
                        },
                        emerald: {
                            600: '#10b981',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body {
            font-family: 'Inter', 'Microsoft JhengHei', sans-serif;
        }
        .ppe-icon-svg {
            width: 72px;
            height: 72px;
            fill: #0284c7;
            transition: transform 0.2s ease;
        }
        .ppe-card:hover .ppe-icon-svg {
            transform: scale(1.1);
        }
        /* Custom Scrollbars */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f5f9;
        }
        ::-webkit-scrollbar-thumb {
            background: #94a3b8;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #64748b;
        }
    </style>
</head>
<body class="h-full flex flex-col text-slate-800 bg-slate-50 min-h-screen">

    <!-- Header -->
    <header class="bg-gradient-to-r from-navy-800 via-indigo-900 to-sky-700 text-white shadow-lg sticky top-0 z-30">
        <div class="max-w-7xl mx-auto px-4 py-4 sm:px-6 lg:px-8 flex flex-col md:flex-row justify-between items-center gap-4">
            <div class="text-center md:text-left">
                <h1 class="text-2xl sm:text-3xl font-bold tracking-tight flex items-center gap-2 justify-center md:justify-start">
                    <span>✈️</span> 適航大進擊：飛機維修 PPE 與工單訓練系統
                </h1>
                <p class="text-sky-200 text-xs sm:text-sm mt-1">Airworthiness Rush: Interactive Maintenance PPE & Work Order System</p>
            </div>
            
            <!-- Voice Selector -->
            <div class="flex items-center bg-white/10 backdrop-blur-md px-3 py-1.5 rounded-lg border border-white/20 text-xs sm:text-sm">
                <label for="voice-select" class="mr-2 whitespace-nowrap text-sky-100 flex items-center gap-1">
                    <span>🔊</span> 語音人聲:
                </label>
                <select id="voice-select" class="bg-navy-800 text-white rounded px-2 py-1 border border-sky-400 focus:outline-none focus:ring-2 focus:ring-sky-300 max-w-[200px] truncate">
                    <option value="">載入語音中...</option>
                </select>
            </div>
        </div>
    </header>

    <!-- Controls Bar -->
    <main class="flex-1 max-w-7xl w-full mx-auto px-4 py-6 sm:px-6 lg:px-8">
        
        <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-4 mb-6 flex flex-col lg:flex-row justify-between items-center gap-4">
            
            <!-- Navigation Tabs -->
            <div class="flex bg-slate-100 p-1 rounded-xl w-full lg:w-auto">
                <button id="btn-ppe" onclick="switchTab('page-ppe')" class="flex-1 lg:flex-none px-5 py-2.5 rounded-lg text-sm font-semibold transition-all duration-200 flex items-center justify-center gap-2 bg-navy-800 text-white shadow-md">
                    <span>🛡️</span> PPE 裝備庫 (<span id="count-ppe">0</span>)
                </button>
                <button id="btn-wo" onclick="switchTab('page-wo')" class="flex-1 lg:flex-none px-5 py-2.5 rounded-lg text-sm font-semibold transition-all duration-200 flex items-center justify-center gap-2 text-slate-600 hover:text-slate-900">
                    <span>📋</span> 維修工單任務 (<span id="count-wo">0</span>)
                </button>
            </div>

            <!-- Search Bar -->
            <div class="relative w-full lg:w-80">
                <input type="text" id="search-input" oninput="handleSearch()" placeholder="搜尋關鍵字 (EN / 繁中...)" 
                    class="w-full pl-10 pr-4 py-2 bg-slate-50 border border-slate-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-sky-600 focus:bg-white transition-all">
                <span class="absolute left-3 top-2.5 text-slate-400">🔍</span>
            </div>

            <!-- Action Buttons -->
            <div class="flex items-center gap-2 w-full lg:w-auto justify-end">
                <button id="add-btn" onclick="handleOpenAddModal()" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl text-sm font-semibold shadow-sm transition-all flex items-center gap-1.5 whitespace-nowrap">
                    <span>➕</span> <span id="add-btn-label">新增 PPE 裝備</span>
                </button>
                <button onclick="promptResetDefaults()" class="px-3 py-2 bg-slate-200 hover:bg-slate-300 text-slate-700 rounded-xl text-sm font-medium transition-all flex items-center gap-1 whitespace-nowrap" title="重設為原廠預設資料">
                    <span>🔄</span> 恢復預設
                </button>
            </div>
        </div>

        <!-- Tab 1: PPE Grid Page -->
        <div id="page-ppe" class="space-y-6">
            <div id="ppe-empty-state" class="hidden text-center py-16 bg-white rounded-2xl border border-slate-200">
                <span class="text-5xl block mb-3">🔍</span>
                <p class="text-slate-500 font-medium">未找到符合條件的 PPE 裝備卡片</p>
            </div>
            <div id="ppe-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                <!-- PPE Cards dynamically injected here -->
            </div>
        </div>

        <!-- Tab 2: Work Orders Page -->
        <div id="page-wo" class="hidden space-y-6">
            <div id="wo-empty-state" class="hidden text-center py-16 bg-white rounded-2xl border border-slate-200">
                <span class="text-5xl block mb-3">📋</span>
                <p class="text-slate-500 font-medium">未找到符合條件的維修工單任務</p>
            </div>
            <div id="wo-container" class="max-w-4xl mx-auto space-y-5">
                <!-- WO Cards dynamically injected here -->
            </div>
        </div>
    </main>

    <!-- PPE Modal (Add / Edit) -->
    <div id="ppe-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-2xl max-w-2xl w-full overflow-hidden transform transition-all max-h-[90vh] flex flex-col">
            <div class="bg-navy-800 text-white px-6 py-4 flex justify-between items-center shrink-0">
                <h3 id="ppe-modal-title" class="font-bold text-lg flex items-center gap-2">
                    <span>🛡️</span> 編輯 PPE 個人防護裝備
                </h3>
                <button onclick="closePPEModal()" class="text-slate-300 hover:text-white text-xl font-bold px-2">&times;</button>
            </div>
            <form id="ppe-form" onsubmit="savePPEForm(event)" class="p-6 space-y-4 overflow-y-auto flex-1">
                <input type="hidden" id="ppe-form-id">
                
                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">裝備名稱 (Equipment Name):</label>
                    <input type="text" id="ppe-form-name" required placeholder="例如: Reflective Vest" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-sky-600">
                </div>

                <!-- Image Source Selection -->
                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">圖示/照片類型 (Image Source):</label>
                    <div class="grid grid-cols-2 gap-3 mb-2">
                        <label class="flex items-center gap-2 border border-slate-200 p-2.5 rounded-lg cursor-pointer hover:bg-slate-50 transition-all">
                            <input type="radio" name="image-type" value="icon" id="img-type-icon" checked onchange="toggleImageTypeUI()" class="text-sky-600 focus:ring-sky-500">
                            <span class="text-xs font-semibold text-slate-700">預設向量圖示</span>
                        </label>
                        <label class="flex items-center gap-2 border border-slate-200 p-2.5 rounded-lg cursor-pointer hover:bg-slate-50 transition-all">
                            <input type="radio" name="image-type" value="photo" id="img-type-photo" onchange="toggleImageTypeUI()" class="text-sky-600 focus:ring-sky-500">
                            <span class="text-xs font-semibold text-slate-700">📷 自訂上傳照片</span>
                        </label>
                    </div>

                    <!-- Preset Icon Option -->
                    <div id="icon-select-container">
                        <select id="ppe-form-icon" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-sky-600 bg-white">
                            <option value="vest">🎽 背心 / 衣物 (Vest / Clothing)</option>
                            <option value="boots">🥾 安全鞋 / 靴子 (Boots / Shoes)</option>
                            <option value="glasses">🥽 護目鏡 / 面罩 (Glasses / Face Shield)</option>
                            <option value="earmuffs">🎧 防音耳罩 / 耳塞 (Ear Protection)</option>
                            <option value="helmet">🪖 安全帽 / 防撞帽 (Helmets / Caps)</option>
                            <option value="gloves">🧤 防護手套 (Gloves)</option>
                            <option value="mask">😷 面罩 / 呼吸器 (Masks / Respirators)</option>
                            <option value="tools">🔧 工具 / 儀器設備 (Tools / Meters)</option>
                            <option value="harness">🦺 全身安全帶 / 防墜繩 (Harness / Lanyards)</option>
                        </select>
                    </div>

                    <!-- Custom Photo Upload Option -->
                    <div id="photo-upload-container" class="hidden space-y-3">
                        <div class="border border-dashed border-sky-300 bg-sky-50/50 p-3 rounded-xl">
                            <label class="block text-xs font-bold text-sky-800 mb-1">選擇照片檔案 (Select Photo):</label>
                            <input type="file" id="ppe-form-file" accept="image/*" onchange="handleImageFileSelect(event)" class="w-full text-xs text-slate-500 file:mr-3 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-sky-600 file:text-white hover:file:bg-sky-700 cursor-pointer">
                        </div>
                        
                        <!-- Photo Fit Mode & Zoom Controls -->
                        <div id="photo-controls-box" class="bg-slate-50 p-3.5 rounded-xl border border-slate-200 space-y-3 text-xs">
                            <div class="flex justify-between items-center">
                                <span class="font-bold text-slate-700 flex items-center gap-1">🖼️ 照片圖框尺寸與顯示模式 (Fit Settings):</span>
                                <button type="button" onclick="resetPhotoFrameControls()" class="px-2 py-0.5 bg-slate-200 hover:bg-slate-300 text-slate-700 rounded text-[11px] font-semibold transition-all">重設模式</button>
                            </div>
                            
                            <!-- Fit Mode Selector -->
                            <div class="grid grid-cols-3 gap-2">
                                <button type="button" id="fit-btn-contain" onclick="setFitMode('contain')" class="py-1.5 px-2 rounded-lg border border-sky-600 bg-sky-50 text-sky-800 font-bold text-xs transition-all text-center">
                                    全照片顯示 (Contain)
                                </button>
                                <button type="button" id="fit-btn-cover" onclick="setFitMode('cover')" class="py-1.5 px-2 rounded-lg border border-slate-300 bg-white text-slate-700 font-semibold text-xs transition-all text-center">
                                    填滿圖框 (Cover)
                                </button>
                                <button type="button" id="fit-btn-custom" onclick="setFitMode('custom')" class="py-1.5 px-2 rounded-lg border border-slate-300 bg-white text-slate-700 font-semibold text-xs transition-all text-center">
                                    自訂縮放 (Custom)
                                </button>
                            </div>

                            <!-- Custom Scaling Sliders (Visible when fitMode === 'custom') -->
                            <div id="custom-slider-box" class="space-y-2 pt-1 border-t border-slate-200 hidden">
                                <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
                                    <div>
                                        <label class="block text-[11px] font-medium text-slate-600 mb-0.5">縮放比例 (Zoom): <span id="scale-val" class="font-bold text-sky-700">100%</span></label>
                                        <input type="range" id="ppe-form-scale" min="50" max="300" value="100" oninput="updateImagePreview()" class="w-full h-1.5 bg-slate-200 rounded-lg appearance-none cursor-pointer accent-sky-600">
                                    </div>
                                    <div>
                                        <label class="block text-[11px] font-medium text-slate-600 mb-0.5">水平偏移 (X 軸): <span id="offset-x-val" class="font-bold text-sky-700">0px</span></label>
                                        <input type="range" id="ppe-form-offset-x" min="-150" max="150" value="0" oninput="updateImagePreview()" class="w-full h-1.5 bg-slate-200 rounded-lg appearance-none cursor-pointer accent-sky-600">
                                    </div>
                                    <div>
                                        <label class="block text-[11px] font-medium text-slate-600 mb-0.5">垂直偏移 (Y 軸): <span id="offset-y-val" class="font-bold text-sky-700">0px</span></label>
                                        <input type="range" id="ppe-form-offset-y" min="-150" max="150" value="0" oninput="updateImagePreview()" class="w-full h-1.5 bg-slate-200 rounded-lg appearance-none cursor-pointer accent-sky-600">
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Image Preview Area (Fixed 180px / h-44 height) -->
                    <div class="mt-3 border border-slate-300 rounded-xl bg-slate-900 h-44 flex items-center justify-center overflow-hidden relative shadow-inner">
                        <span class="text-[11px] font-bold text-white/90 absolute top-2 left-2 bg-black/60 backdrop-blur-sm px-2 py-0.5 rounded shadow z-10">圖框 180px 即時預覽</span>
                        <div id="image-preview-box" class="w-full h-full flex items-center justify-center">
                            <!-- Live image or SVG preview -->
                        </div>
                    </div>
                </div>

                <!-- Purpose EN & ZH -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">功能用途 🇺🇸 (Purpose - English):</label>
                        <textarea id="ppe-form-purpose-en" rows="3" required placeholder="Enhances visual awareness..." class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-sky-600"></textarea>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">功能用途 🇹🇼 (用途 - 繁體中文):</label>
                        <textarea id="ppe-form-purpose-zh" rows="3" required placeholder="提高作業人員於機坪..." class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-sky-600"></textarea>
                    </div>
                </div>

                <!-- Scenario EN & ZH -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">應用場景 🇺🇸 (Scenario - English):</label>
                        <textarea id="ppe-form-scenario-en" rows="3" required placeholder="Mandatory for all ramp operations..." class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-sky-600"></textarea>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">應用場景 🇹🇼 (使用場景 - 繁體中文):</label>
                        <textarea id="ppe-form-scenario-zh" rows="3" required placeholder="所有機坪作業（不分晝夜）強制穿著..." class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-sky-600"></textarea>
                    </div>
                </div>

                <div class="pt-3 flex justify-end gap-3 border-t border-slate-100">
                    <button type="button" onclick="closePPEModal()" class="px-4 py-2 border border-slate-300 rounded-xl text-slate-600 hover:bg-slate-50 text-sm font-semibold">取消</button>
                    <button type="submit" class="px-5 py-2 bg-sky-600 hover:bg-sky-700 text-white rounded-xl text-sm font-semibold shadow-sm">儲存變更</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Work Order Modal (Add / Edit) -->
    <div id="wo-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-2xl max-w-lg w-full overflow-hidden transform transition-all">
            <div class="bg-navy-800 text-white px-6 py-4 flex justify-between items-center">
                <h3 id="wo-modal-title" class="font-bold text-lg flex items-center gap-2">
                    <span>📋</span> 編輯維修工單任務
                </h3>
                <button onclick="closeWOModal()" class="text-slate-300 hover:text-white text-xl font-bold px-2">&times;</button>
            </div>
            <form id="wo-form" onsubmit="saveWOForm(event)" class="p-6 space-y-4">
                <input type="hidden" id="wo-form-id">
                
                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">工單編號與標題 (Title):</label>
                    <input type="text" id="wo-form-title" required placeholder="例如: WO-21: Engine Inspection" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-sky-600">
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">維修作業情境說明 (Task Description):</label>
                    <textarea id="wo-form-text" rows="3" required placeholder="詳細說明作業地點、氣候條件與實施之維修項目..." class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-sky-600"></textarea>
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">建議標準防護裝備 (Recommended PPE Answer):</label>
                    <textarea id="wo-form-ans" rows="3" required placeholder="例如: Raincoat (雨衣), Chemical-resistant gloves (防化學手套)..." class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-sky-600"></textarea>
                </div>

                <div class="pt-3 flex justify-end gap-3 border-t border-slate-100">
                    <button type="button" onclick="closeWOModal()" class="px-4 py-2 border border-slate-300 rounded-xl text-slate-600 hover:bg-slate-50 text-sm font-semibold">取消</button>
                    <button type="submit" class="px-5 py-2 bg-sky-600 hover:bg-sky-700 text-white rounded-xl text-sm font-semibold shadow-sm">儲存變更</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Confirmation Dialog Modal -->
    <div id="confirm-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-2xl max-w-sm w-full p-6 text-center">
            <div id="confirm-icon" class="text-4xl mb-3">⚠</div>
            <h4 id="confirm-title" class="text-lg font-bold text-slate-800 mb-2">確定執行此動作？</h4>
            <p id="confirm-msg" class="text-sm text-slate-600 mb-6">此操作無法復原，請確認是否繼續。</p>
            <div class="flex justify-center gap-3">
                <button id="confirm-cancel-btn" onclick="closeConfirmModal()" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl text-sm font-semibold transition-all">取消</button>
                <button id="confirm-action-btn" class="px-4 py-2 bg-red-600 hover:bg-red-700 text-white rounded-xl text-sm font-semibold shadow-sm transition-all">確定刪除</button>
            </div>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="fixed bottom-6 right-6 z-50 transform translate-y-20 opacity-0 transition-all duration-300 bg-slate-900 text-white px-5 py-3 rounded-xl shadow-2xl flex items-center gap-3 border border-slate-700">
        <span id="toast-icon">✨</span>
        <span id="toast-msg" class="text-sm font-medium">訊息通知</span>
    </div>

    <script>
        // SVG Library for Default PPE Icons
        const svgLibrary = {
            vest: `<svg class="ppe-icon-svg" viewBox="0 0 24 24"><path d="M12 2L4 6v6c0 5.25 3.42 10.16 8 11.42 4.58-1.26 8-6.17 8-11.42V6l-8-4zm-1 15h2v2h-2v-2zm0-8h2v5h-2V9z"/></svg>`,
            boots: `<svg class="ppe-icon-svg" viewBox="0 0 24 24"><path d="M20.5 15l-3.5-3V4c0-.55-.45-1-1-1h-6c-.55 0-1 .45-1 1v12H4c-.55 0-1 .45-1 1v3c0 .55.45 1 1 1h16c.55 0 1-.45 1-1v-4c0-.28-.11-.53-.3-.7z"/></svg>`,

        /**
         * Canvas Image Compression Helper (Keeps Base64 sizes compact for localStorage)
         */
        function compressImage(file, maxWidth = 500, maxHeight = 500, quality = 0.75) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const img = new Image();
                    img.onload = function() {
                        let width = img.width;
                        let height = img.height;

                        if (width > height) {
                            if (width > maxWidth) {
                                height = Math.round((height * maxWidth) / width);
                                width = maxWidth;
                            }
                        } else {
                            if (height > maxHeight) {
                                width = Math.round((width * maxHeight) / height);
                                height = maxHeight;
                            }
                        }

                        const canvas = document.createElement('canvas');
                        canvas.width = width;
                        canvas.height = height;

                        const ctx = canvas.getContext('2d');
                        ctx.fillStyle = "#0F172A"; // Dark background
                        ctx.fillRect(0, 0, canvas.width, canvas.height);
                        ctx.drawImage(img, 0, 0, width, height);

                        const compressedDataUrl = canvas.toDataURL('image/jpeg', quality);
                        resolve(compressedDataUrl);
                    };
                    img.onerror = reject;
                    img.src = e.target.result;
                };
                reader.onerror = reject;
                reader.readAsDataURL(file);
            });
        }

                    ppeList = [...DEFAULT_PPE];

            if (storedWO) {

                }

                woList = [...DEFAULT_WO];
                saveWOToStorage();
            }
        }

        function loadVoices() {
            if (!synth) return;
            voices = synth.getVoices();
            const voiceSelect = document.getElementById('voice-select');
            voiceSelect.innerHTML = '';

            let enVoices = voices.filter(v => v.lang.startsWith('en'));
            if (enVoices.length === 0) enVoices = voices;

            enVoices.sort((a, b) => {
                const keywords = ['natural', 'google', 'microsoft', 'premium', 'enhanced'];
                let scoreA = keywords.reduce((acc, k) => acc + (a.name.toLowerCase().includes(k) ? 1 : 0), 0);
                let scoreB = keywords.reduce((acc, k) => acc + (b.name.toLowerCase().includes(k) ? 1 : 0), 0);
                return scoreB - scoreA;
            });

            enVoices.forEach(voice => {
                const option = document.createElement('option');
                option.textContent = `${voice.name} (${voice.lang})`;
                option.value = voice.name;
                voiceSelect.appendChild(option);
            });
        }

        if (synth && 'onvoiceschanged' in synth) {
            synth.onvoiceschanged = loadVoices;
        }
        setTimeout(loadVoices, 500);

            if (!synth) {
                showToast('您的瀏覽器不支援 Web Speech 語音功能', '⚠️');
                return;
            }
            synth.cancel();
            const speech = new SpeechSynthesisUtterance(textToSpeak);
            const selectedVoiceName = document.getElementById('voice-select').value;
            const selectedVoice = voices.find(v => v.name === selectedVoiceName);
            if (selectedVoice) speech.voice = selectedVoice;
            speech.rate = 0.88;
            speech.pitch = 1.0;
            synth.speak(speech);
            showToast('🔊 播放語音中...', '🔊');
        }

                openWOModal();
            }
        }

        function toggleImageTypeUI() {
            const isPhoto = document.getElementById('img-type-photo').checked;
            const iconContainer = document.getElementById('icon-select-container');
            const photoContainer = document.getElementById('photo-upload-container');

            if (isPhoto) {
                iconContainer.classList.add('hidden');
                photoContainer.classList.remove('hidden');
            } else {
                iconContainer.classList.remove('hidden');
                photoContainer.classList.add('hidden');
            }
            updateImagePreview();
        }

        function setFitMode(mode) {
            currentFitMode = mode;
            const btnContain = document.getElementById('fit-btn-contain');
            const btnCover = document.getElementById('fit-btn-cover');
            const btnCustom = document.getElementById('fit-btn-custom');
            const customSliderBox = document.getElementById('custom-slider-box');

            // Reset UI states
            btnContain.className = "py-1.5 px-2 rounded-lg border border-slate-300 bg-white text-slate-700 font-semibold text-xs transition-all text-center";
            btnCover.className = "py-1.5 px-2 rounded-lg border border-slate-300 bg-white text-slate-700 font-semibold text-xs transition-all text-center";
            btnCustom.className = "py-1.5 px-2 rounded-lg border border-slate-300 bg-white text-slate-700 font-semibold text-xs transition-all text-center";

            if (mode === 'contain') {
                btnContain.className = "py-1.5 px-2 rounded-lg border border-sky-600 bg-sky-50 text-sky-800 font-bold text-xs transition-all text-center";
                customSliderBox.classList.add('hidden');
            } else if (mode === 'cover') {
                btnCover.className = "py-1.5 px-2 rounded-lg border border-sky-600 bg-sky-50 text-sky-800 font-bold text-xs transition-all text-center";
                customSliderBox.classList.add('hidden');
            } else if (mode === 'custom') {
                btnCustom.className = "py-1.5 px-2 rounded-lg border border-sky-600 bg-sky-50 text-sky-800 font-bold text-xs transition-all text-center";
                customSliderBox.classList.remove('hidden');
            }

            updateImagePreview();
        }

        function resetPhotoFrameControls() {
            document.getElementById('ppe-form-scale').value = 100;
            document.getElementById('ppe-form-offset-x').value = 0;
            document.getElementById('ppe-form-offset-y').value = 0;
            setFitMode('contain');
        }

        function updateImagePreview() {
            const isPhoto = document.getElementById('img-type-photo').checked;
            const previewBox = document.getElementById('image-preview-box');

            if (isPhoto) {
                if (!currentPhotoData) {
                    previewBox.innerHTML = `<span class="text-xs text-slate-400">尚無選擇照片 (請點選上方上傳檔案)</span>`;
                    return;
                }

                if (currentFitMode === 'contain') {
                    previewBox.innerHTML = `
                        <img src="${currentPhotoData}" class="w-full h-full object-contain p-2 transition-all">
                    `;
                } else if (currentFitMode === 'cover') {
                    previewBox.innerHTML = `
                        <img src="${currentPhotoData}" class="w-full h-full object-cover transition-all">
                    `;
                } else {
                    const scale = document.getElementById('ppe-form-scale').value || 100;
                    const offsetX = document.getElementById('ppe-form-offset-x').value || 0;
                    const offsetY = document.getElementById('ppe-form-offset-y').value || 0;

                    document.getElementById('scale-val').textContent = `${scale}%`;
                    document.getElementById('offset-x-val').textContent = `${offsetX}px`;
                    document.getElementById('offset-y-val').textContent = `${offsetY}px`;

                    previewBox.innerHTML = `
                        <div class="w-full h-full relative overflow-hidden flex items-center justify-center bg-slate-900">
                            <img src="${currentPhotoData}" class="absolute max-w-none max-h-none transition-transform duration-75"
                                 style="transform: translate(${offsetX}px, ${offsetY}px) scale(${scale / 100}); transform-origin: center center; width: 100%; height: 100%; object-fit: cover;">
                        </div>
                    `;
                }
            } else {
                const selectedIconKey = document.getElementById('ppe-form-icon').value;
                const iconSvg = svgLibrary[selectedIconKey] || svgLibrary.tools;
                previewBox.innerHTML = iconSvg;
            }
        }

        async function handleImageFileSelect(e) {
            const file = e.target.files[0];
            if (!file) return;

            if (!file.type.startsWith('image/')) {
                showToast('請上傳有效的圖片檔案 (JPG, PNG)', '⚠️');
                return;
            }

            try {
                showToast('正在優化壓縮照片中...', '⏳');
                currentPhotoData = await compressImage(file, 500, 500, 0.75);
                updateImagePreview();
                showToast('照片上傳並壓縮成功！', '📸');
            } catch (err) {
                showToast('照片處理失敗，請試試其他圖片', '⚠️');
            }
        }

        function openPPEModal(id = null) {
            const modal = document.getElementById('ppe-modal');
            const title = document.getElementById('ppe-modal-title');
            const fileInput = document.getElementById('ppe-form-file');
            fileInput.value = '';

            if (id) {
                const item = ppeList.find(x => x.id === id);
                if (!item) return;
                title.innerHTML = '<span>✏️</span> 編輯 PPE 個人防護裝備';
                document.getElementById('ppe-form-id').value = item.id;
                document.getElementById('ppe-form-name').value = item.name;
                document.getElementById('ppe-form-purpose-en').value = item.purposeEn || item.purpose || '';
                document.getElementById('ppe-form-purpose-zh').value = item.purposeZh || item.purpose || '';
                document.getElementById('ppe-form-scenario-en').value = item.scenarioEn || item.scenario || '';
                document.getElementById('ppe-form-scenario-zh').value = item.scenarioZh || item.scenario || '';

                document.getElementById('ppe-form-scale').value = item.photoScale || 100;
                document.getElementById('ppe-form-offset-x').value = item.photoOffsetX || 0;
                document.getElementById('ppe-form-offset-y').value = item.photoOffsetY || 0;

                if (item.iconType === 'photo' && item.photoData) {
                    document.getElementById('img-type-photo').checked = true;
                    currentPhotoData = item.photoData;
                    setFitMode(item.fitMode || 'contain');
                } else {
                    document.getElementById('img-type-icon').checked = true;
                    document.getElementById('ppe-form-icon').value = item.icon || 'tools';
                    currentPhotoData = null;
                    setFitMode('contain');
                }
            } else {
                title.innerHTML = '<span>➕</span> 新增 PPE 個人防護裝備';
                document.getElementById('ppe-form').reset();
                document.getElementById('ppe-form-id').value = '';
                document.getElementById('img-type-icon').checked = true;
                currentPhotoData = null;
                resetPhotoFrameControls();
            }

            toggleImageTypeUI();
            modal.classList.remove('hidden');
        }

        function closePPEModal() {
            document.getElementById('ppe-modal').classList.add('hidden');
        }

        function savePPEForm(e) {
            e.preventDefault();
            const id = document.getElementById('ppe-form-id').value;
            const name = document.getElementById('ppe-form-name').value.trim();
            const purposeEn = document.getElementById('ppe-form-purpose-en').value.trim();
            const purposeZh = document.getElementById('ppe-form-purpose-zh').value.trim();
            const scenarioEn = document.getElementById('ppe-form-scenario-en').value.trim();
            const scenarioZh = document.getElementById('ppe-form-scenario-zh').value.trim();
            const isPhoto = document.getElementById('img-type-photo').checked;

            let iconType = 'icon';
            let icon = 'tools';
            let photoData = null;

            const photoScale = parseInt(document.getElementById('ppe-form-scale').value) || 100;
            const photoOffsetX = parseInt(document.getElementById('ppe-form-offset-x').value) || 0;
            const photoOffsetY = parseInt(document.getElementById('ppe-form-offset-y').value) || 0;

            if (isPhoto) {
                if (!currentPhotoData) {
                    showToast('請先選擇並上傳裝備照片！', '⚠️');
                    return;
                }
                iconType = 'photo';
                photoData = currentPhotoData;
            } else {
                iconType = 'icon';
                icon = document.getElementById('ppe-form-icon').value;
            }

            const payload = { 
                id, 
                name, 
                purposeEn, 
                purposeZh, 
                scenarioEn, 
                scenarioZh, 
                iconType, 
                icon, 
                photoData, 
                fitMode: currentFitMode,
                photoScale, 
                photoOffsetX, 
                photoOffsetY 
            };

            if (id) {
                const index = ppeList.findIndex(x => x.id === id);
                if (index !== -1) {
                    ppeList[index] = payload;
                    showToast('PPE 裝備與圖片設定更新成功！', '✅');
                }
            } else {
                payload.id = 'ppe_' + Date.now();
                ppeList.unshift(payload);
                showToast('已新增全新的 PPE 裝備！', '🎉');
            }

            savePPEToStorage();
            closePPEModal();
            handleSearch();
        }

        function promptDeletePPE(id) {
            const item = ppeList.find(x => x.id === id);
            if (!item) return;

            openConfirmModal({
                title: `確定要刪除「${item.name}」？`,
                msg: '刪除後裝備資料將無法還原，確定繼續？',
                onConfirm: () => {
                    ppeList = ppeList.filter(x => x.id !== id);
                    savePPEToStorage();
                    handleSearch();
                    showToast('已成功刪除 PPE 裝備', '🗑️');
                }
            });
        }

        function openWOModal(id = null) {
            const modal = document.getElementById('wo-modal');
            const title = document.getElementById('wo-modal-title');

            if (id) {
                const wo = woList.find(x => x.id === id);
                if (!wo) return;
                title.innerHTML = '<span>✏️</span> 編輯維修工單任務';
                document.getElementById('wo-form-id').value = wo.id;
                document.getElementById('wo-form-title').value = wo.title;
                document.getElementById('wo-form-text').value = wo.text;
                document.getElementById('wo-form-ans').value = wo.ans;
            } else {
                title.innerHTML = '<span>➕</span> 新增維修工單任務';
                document.getElementById('wo-form').reset();
                document.getElementById('wo-form-id').value = '';
                document.getElementById('wo-form-title').value = `WO-${woList.length + 1}: New Task`;
            }
            modal.classList.remove('hidden');
        }

        function closeWOModal() {
            document.getElementById('wo-modal').classList.add('hidden');
        }

        function saveWOForm(e) {
            e.preventDefault();
            const id = document.getElementById('wo-form-id').value;
            const title = document.getElementById('wo-form-title').value.trim();
            const text = document.getElementById('wo-form-text').value.trim();
            const ans = document.getElementById('wo-form-ans').value.trim();

            if (id) {
                const index = woList.findIndex(x => x.id === id);
                if (index !== -1) {
                    woList[index] = { id, title, text, ans };
                    showToast('維修工單更新成功！', '✅');
                }
            } else {
                const newId = 'wo_' + Date.now();
                woList.unshift({ id: newId, title, text, ans });
                showToast('已新增全新維修工單！', '🎉');
            }

            saveWOToStorage();
            closeWOModal();
            handleSearch();
        }

        function promptDeleteWO(id) {
            const wo = woList.find(x => x.id === id);
            if (!wo) return;

            openConfirmModal({
                title: `確定刪除工單「${wo.title}」？`,
                msg: '刪除後該工單題目將移除，確定繼續？',
                onConfirm: () => {
                    woList = woList.filter(x => x.id !== id);
                    saveWOToStorage();
                    handleSearch();
                    showToast('已刪除該維修工單', '🗑️');
                }
            });
        }

        function promptResetDefaults() {
            openConfirmModal({
                title: '重設所有資料為預設值？',
                msg: '此操作將還原所有原始 32 種雙語 PPE 裝備與 20 套維修工單，您自行新增或修改的內容將被覆蓋！',
                onConfirm: () => {
                    ppeList = [...DEFAULT_PPE];
                    woList = [...DEFAULT_WO];
                    savePPEToStorage();
                    saveWOToStorage();
                    handleSearch();
                    showToast('已恢復原廠預設 32 項雙語 PPE 與 20 項工單', '🔄');
                }
            });
        }

        // Confirm Dialog Helper
        let pendingConfirmAction = null;

        function openConfirmModal({ title, msg, onConfirm }) {
            document.getElementById('confirm-title').textContent = title;
            document.getElementById('confirm-msg').textContent = msg;
            pendingConfirmAction = onConfirm;
            
            const actionBtn = document.getElementById('confirm-action-btn');
            actionBtn.onclick = () => {
                if (pendingConfirmAction) pendingConfirmAction();
                closeConfirmModal();
            };
            
            document.getElementById('confirm-modal').classList.remove('hidden');
        }

        function closeConfirmModal() {
            document.getElementById('confirm-modal').classList.add('hidden');
            pendingConfirmAction = null;
        }

        // Toast Helper
        function showToast(msg, icon = '✨') {
            const toast = document.getElementById('toast');
            document.getElementById('toast-msg').textContent = msg;
            document.getElementById('toast-icon').textContent = icon;

            toast.classList.remove('translate-y-20', 'opacity-0');
            toast.classList.add('translate-y-0', 'opacity-100');

            setTimeout(() => {
                toast.classList.remove('translate-y-0', 'opacity-100');
                toast.classList.add('translate-y-20', 'opacity-0');
            }, 3000);
        }

        // Utility Helpers
        function escapeHtml(str) {
            if (!str) return '';
            return str
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        function escapeJsStr(str) {
            if (!str) return '';
            return str.replace(/'/g, "\\'").replace(/"/g, '\\"');
        }

        document.getElementById('ppe-form-icon').addEventListener('change', updateImagePreview);

        window.onload = function() {
            initData();
            renderPPE();
            renderWO();
        };
    </script>
</body>
</html>
